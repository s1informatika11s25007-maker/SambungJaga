name: SambungJaga AI — Competition CI Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Automated Role Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Application
        run: npm run build

      - name: 5. Run Vitest Unit & Component Tests
        run: npm run test:unit

      - name: 6. Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 7. Run Playwright Automated E2E Tests for All Account Roles
        run: npm run test:e2e

      - name: 8. Upload Playwright Test HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: playwright-report/
          retention-days: 30

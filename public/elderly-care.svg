<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="skinGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="nurseUniform" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="elderCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0c4a6e" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="800" height="600" rx="32" fill="url(#bgGrad)" />
  <circle cx="150" cy="120" r="180" fill="#38bdf8" opacity="0.15" />
  <circle cx="680" cy="480" r="220" fill="#818cf8" opacity="0.15" />

  <!-- Cozy Interior Room Backdrop -->
  <rect x="50" y="40" width="700" height="520" rx="24" fill="#ffffff" opacity="0.9" filter="url(#shadow)" />

  <!-- Plant Decoration -->
  <path d="M 100 500 Q 80 400 120 300 Q 140 400 100 500 Z" fill="#10b981" opacity="0.7" />
  <path d="M 120 500 Q 150 380 180 320 Q 160 420 120 500 Z" fill="#059669" opacity="0.8" />

  <!-- Elderly Woman Character (Left) -->
  <g id="ElderlyWoman">
    <!-- Hair -->
    <path d="M 280 230 C 260 150, 380 150, 360 230 Z" fill="#e2e8f0" />
    <circle cx="320" cy="180" r="45" fill="#cbd5e1" />
    <!-- Head -->
    <circle cx="320" cy="220" r="35" fill="url(#skinGrad1)" />
    <!-- Glasses -->
    <circle cx="308" cy="215" r="10" fill="none" stroke="#475569" stroke-width="2.5" />
    <circle cx="332" cy="215" r="10" fill="none" stroke="#475569" stroke-width="2.5" />
    <line x1="318" y1="215" x2="322" y2="215" stroke="#475569" stroke-width="2.5" />
    <!-- Smile -->
    <path d="M 310 235 Q 320 245 330 235" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pink Sweater / Shawl -->
    <path d="M 250 360 C 250 280, 390 280, 390 360 L 390 460 L 250 460 Z" fill="url(#elderCloth)" filter="url(#shadow)" />
  </g>

  <!-- Young Nurse/Caregiver Character (Right, Caring Support) -->
  <g id="NurseCaregiver">
    <!-- Hair -->
    <circle cx="480" cy="180" r="48" fill="#1e293b" />
    <!-- Head -->
    <circle cx="470" cy="200" r="34" fill="url(#skinGrad2)" />
    <!-- Eyes & Smile -->
    <circle cx="458" cy="195" r="3" fill="#0f172a" />
    <circle cx="478" cy="195" r="3" fill="#0f172a" />
    <path d="M 460 212 Q 468 222 476 212" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
    <!-- Medical Nurse Uniform -->
    <path d="M 400 340 C 400 260, 540 260, 540 340 L 540 460 L 400 460 Z" fill="url(#nurseUniform)" filter="url(#shadow)" />
    <!-- Medical Cross Badge -->
    <circle cx="470" cy="280" r="12" fill="#ffffff" />
    <path d="M 470 273 L 470 287 M 463 280 L 477 280" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Heart Connection Effect -->
  <path d="M 390 200 Q 400 180 410 200 Q 400 220 390 200 Z" fill="#ef4444" opacity="0.9" />
</svg>
